# Beatopia production stack (Vultr VM), deployed with deploy/deploy.sh (API only by default; WORKER=1 / CADDY=1).
# Targeted by hand, from /opt/beatopia, always one named service with --no-deps and never --remove-orphans:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --no-deps api
# The worker (WS1's job loop) is behind the "worker" profile; recreate it only via `WORKER=1 deploy/deploy.sh`,
# which backs up and carries over its data directory (issue #13).
name: beatopia

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
      args: &revision
        REVISION: ${REVISION:-unknown}
    image: beatopia-api:latest
    env_file: ../.env
    environment:
      USE_FIXTURES: "0"
    volumes:
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8000"
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
      args: *revision
    image: beatopia-worker:latest
    env_file: ../.env
    environment:
      # Same caps as WS1's worker/launch.ps1: leave CPU for the API (4 vCPU VM) while Demucs/CLAP run.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      # WORKER_DATA_DIR (default worker/data): separation/import checkpoints, receipts, worker.jsonl. Without a
      # volume they live in the container layer and a recreate loses them (issue #13). deploy.sh WORKER=1 backs up
      # the old container's copy and seeds this volume from it the first time.
      - worker_data:/app/worker/data
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. 45-77-216-35.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  hf_cache:
  torch_cache:
  caddy_data:
  caddy_config:
  worker_data:
    name: beatopia_worker_data  # fixed name: deploy.sh seeds it from a backup with a helper container
