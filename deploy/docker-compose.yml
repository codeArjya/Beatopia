# Beatopia production stack (Vultr VM). From the repo root on the VM (/opt/beatopia):
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# The worker is behind the "worker" profile until WS1's worker loop is implemented:
#   docker compose -f deploy/docker-compose.yml --env-file .env --profile worker up -d --build
name: beatopia

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: beatopia-api:latest
    env_file: ../.env
    environment:
      USE_FIXTURES: "0"
    volumes:
      - hf_cache:/root/.cache/huggingface
    expose:
      - "8000"
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    image: beatopia-worker:latest
    env_file: ../.env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. 45-77-216-35.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  hf_cache:
  torch_cache:
  caddy_data:
  caddy_config:
